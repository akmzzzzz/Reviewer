<script>
const questions = [
  // --- INTRODUCTION & ETYMOLOGY ---
  {
    category: "Introduction",
    q: "What is the etymological origin of the word 'Porifera'?",
    options: ["Greek for 'sac-like'", "Latin for 'pore-bearing'", "Latin for 'water-filtering'", "Greek for 'glass-bodied'"],
    answer: 1,
    note: "The etymology is Latin porus (pore) + -ferre (to bear)[cite: 2]."
  },

  // --- CLASS CALCISPONGIAE ---
  {
    category: "Class Calcispongiae",
    q: "What is the specific composition of the spicules in Class Calcispongiae?",
    options: ["Silica", "Spongin", "Calcium carbonate", "Chitin"],
    answer: 2,
    note: "Spicule composition for Calcispongiae is Calcium carbonate[cite: 2]."

  {
    category: "Class Calcispongiae",
    q: "How are the spicules structured in Class Calcispongiae?",

    answer: 1,
    note: "Their spicule structure is straight (monaxons) or with three to four rays[cite: 2]."
  },
  {
    category: "Class Calcispongiae",
    q: "Which of the following are representative genera of Class Calcispongiae?",
    options: ["Leucosolenia and Sycon", "Amoeba and Paramecium", "Spongillidae and Dictyostelium", "Trypanosoma and Trichonympha"],
    answer: 0,
    note: "Representative genera include Leucosolenia and Sycon[cite: 2]."
  },
  {
    category: "Class Calcispongiae",
    q: "What body organization types can be found within Class Calcispongiae?",
    options: ["Only Asconoid", "Only Leuconoid", "Asconoid, syconoid, and leuconoid structures", "Only Syconoid"],
    answer: 2,
    note: "Body organization types include Asconoid, syconoid, and leuconoid structures[cite: 2]."
  },

  // --- CLASS HEXACTINELLIDA ---
  {
    category: "Class Hexactinellida",
    q: "What is the alternative name for Class Hexactinellida?",
    options: ["Class Demospongiae", "Class Hyalospongiae", "Class Spongillidae", "Class Coccidea"],
    answer: 1,
    note: "The alternative name is Class Hyalospongiae[cite: 2]."
  },
  {
    category: "Class Hexactinellida",
    q: "What type of spicules characterizes Class Hexactinellida?",
    options: ["Calcium carbonate monaxons", "Six-rayed spicules of silica bound together to form a network", "Spongin fibers", "Absent spicules"],
    answer: 1,
    note: "They possess six-rayed spicules of silica bound together to form a network[cite: 2]."
  },
  {
    category: "Class Hexactinellida",
    q: "What is the primary habitat for nearly all members of Class Hexactinellida?",
    options: ["Freshwater streams", "Coastal tide pools", "Deep-sea environments", "Terrestrial caves"],
    answer: 2,
    note: "Nearly all are deep-sea forms[cite: 2]."
  },
  {
    category: "Class Hexactinellida",
    q: "What unique cellular organization is found in Class Hexactinellida?",
    options: ["Syncytial cell structure (multinucleate cytoplasm)", "Strictly unicellular organization", "Perfect bilateral symmetry", "Extensive extracellular matrix without nuclei"],
    answer: 0,
    note: "They have a syncytial cell structure — many nuclei within a large cell (multinucleate cytoplasm without cell membranes separating nuclei)[cite: 2]."
  },

  // --- CLASS DEMOSPONGIAE ---
  {
    category: "Class Demospongiae",
    q: "Class Demospongiae is highly significant because it contains what percentage of all living sponge species?",
    options: ["5%", "25%", "50%", "95%"],
    answer: 3,
    note: "It contains 95% of living sponge species and most large sponges[cite: 2]."
  },
  {
    category: "Class Demospongiae",
    q: "What is the composition of the spicules in Class Demospongiae?",
    options: ["Always calcium carbonate", "Siliceous but not six-rayed, or bound by spongin, or completely absent", "Strictly six-rayed silica", "Chitinous network"],
    answer: 1,
    note: "Spicules are siliceous but not six-rayed; they may be absent or bound together by spongin[cite: 2]."
  },
  {
    category: "Class Demospongiae",
    q: "Which body form is found in ALL species of Class Demospongiae?",
    options: ["Asconoid", "Syconoid", "Leuconoid", "Polyp"],
    answer: 2,
    note: "They exhibit a Leuconoid body form for all species[cite: 2]."
  },
  {
    category: "Class Demospongiae",
    q: "While almost all demosponges are marine, which family represents the only freshwater sponges?",
    options: ["Leucosolenidae", "Syconidae", "Spongillidae", "Hexactinellidae"],
    answer: 2,
    note: "The Spongillidae family represents the only freshwater sponges[cite: 2]."
  },

  // --- ANATOMICAL STRUCTURES ---
  {
    category: "Anatomical Structures",
    q: "What is the primary function of spicules in a sponge?",
    options: ["To digest food particles", "To serve as support and skeletal elements", "To carry oxygen to deeper tissues", "To produce gametes"],
    answer: 1,
    note: "Spicules are support and skeletal elements of sponge bodies[cite: 2]."
  },
  {
    category: "Anatomical Structures",
    q: "Sponge collar cells, which are specialized feeding cells, are properly known as:",
    options: ["Archeocytes", "Oocytes", "Choanocytes", "Parenchymula"],
    answer: 2,
    note: "Sponge collar cells are called Choanocytes[cite: 2]."
  },
  {
    category: "Anatomical Structures",
    q: "What specific structures make up the 'collar' of a choanocyte?",
    options: ["Calcium carbonate spikes", "A network of spongin", "A collar of microvilli surrounding a flagellum", "Six-rayed silica threads"],
    answer: 2,
    note: "Choanocytes possess a collar of microvilli surrounding a flagellum[cite: 2]."
  },
  {
    category: "Anatomical Structures",
    q: "Which cells are directly responsible for generating water currents and operating the filter-feeding mechanism in sponges?",
    options: ["Syncytial cells", "Gemmules", "Choanocytes", "Monaxons"],
    answer: 2,
    note: "Choanocytes generate water currents through the sponge body and are responsible for the filter-feeding mechanism[cite: 2]."
  },

  // --- BODY FORMS ---
  {
    category: "Body Forms",
    q: "Which is the simplest sponge body form, typically found in some calcareous sponges?",
    options: ["Syconoid", "Asconoid", "Leuconoid", "Syncytial"],
    answer: 1,
    note: "Asconoid is the simplest form; found in some calcareous sponges[cite: 2]."
  },
  {
    category: "Body Forms",
    q: "Which sponge body form is of intermediate complexity?",
    options: ["Syconoid", "Asconoid", "Leuconoid", "Hyalospongiae"],
    answer: 0,
    note: "Syconoid is the intermediate complexity form; found in some calcareous sponges[cite: 2]."
  },
  {
    category: "Body Forms",
    q: "Which body form is the most complex and is found in all demosponges?",
    options: ["Asconoid", "Syconoid", "Leuconoid", "Syncytial"],
    answer: 2,
    note: "Leuconoid is the most complex form; found in all demosponges and many other sponges[cite: 2]."
  },

  // --- PHYLOGENY & EVOLUTION ---
  {
    category: "Phylogeny",
    q: "Evolutionarily, how are sponges related to other animals?",
    options: ["They are completely unrelated to the animal kingdom", "They are considered a sister taxon to other animals", "They evolved directly from fungi", "They are the descendants of modern cnidarians"],
    answer: 1,
    note: "Sponges are considered a sister taxon to other animals, sharing many traits[cite: 2]."
  },
  {
    category: "Phylogeny",
    q: "Proteins for cell adhesion and cell-signaling in sponges show homology to:",
    options: ["Plants", "Bacteria", "Other animals", "Fungi"],
    answer: 2,
    note: "Proteins for cell adhesion and cell-signaling are homologous to other animals[cite: 2]."
  },
  {
    category: "Phylogeny",
    q: "What evidence of cellular complexity links some sponges to other animal phyla?",
    options: ["Presence of a true brain", "A basement membrane with collagen and adherens junctions with cadherin molecules", "The development of an exoskeleton", "A closed circulatory system"],
    answer: 1,
    note: "Some sponges have a basement membrane with collagen and adherens junctions with cadherin molecules that connect epithelial cells[cite: 2]."
  },
  {
    category: "Phylogeny",
    q: "Which developmental stages do sponges exhibit that are common to many other animals?",
    options: ["Pupa and imago stages", "Blastula and some form gastrula stages", "Nymph stages", "Tadpole stages"],
    answer: 1,
    note: "Sponges exhibit blastula and some form gastrula stages like many other animals[cite: 2]."
  },

  // --- REPRODUCTION ---
  {
    category: "Asexual Reproduction",
    q: "What happens during sponge fragmentation?",
    options: ["The sponge releases a toxic cloud", "Sponge pieces can regenerate into complete organisms", "The sponge dissolves into single cells that die", "The sponge changes its color"],
    answer: 1,
    note: "In fragmentation, sponge pieces can regenerate into complete organisms[cite: 2]."
  },
  {
    category: "Asexual Reproduction",
    q: "What are gemmules?",
    options: ["Sperm cells", "Specialized structures for internal budding in freshwater sponges", "External buds that fall off immediately", "The name for sponge eggs"],
    answer: 1,
    note: "Internal buds/gemmules are specialized structures in freshwater sponges[cite: 2]."
  },
  {
    category: "Asexual Reproduction",
    q: "What types of cells are contained inside a gemmule?",
    options: ["Choanocytes and spicules", "Archeocytes and nutritive cells", "Nerve cells and muscle cells", "Epithelial cells only"],
    answer: 1,
    note: "Gemmules contain archeocytes and nutritive cells[cite: 2]."
  },
  {
    category: "Asexual Reproduction",
    q: "What is the primary evolutionary advantage of producing gemmules?",
    options: ["They allow for rapid swimming", "They attract mates for sexual reproduction", "They can survive harsh conditions and germinate when conditions improve", "They produce venom to deter predators"],
    answer: 2,
    note: "Gemmules can survive harsh conditions and germinate when conditions improve[cite: 2]."
  },
  {
    category: "Sexual Reproduction",
    q: "What is the breeding system of most sponges?",
    options: ["Dioecious (separate sexes)", "Monoecious (hermaphroditic)", "Parthenogenetic", "Asexual only"],
    answer: 1,
    note: "Breeding system: Most sponges are monoecious (hermaphroditic)[cite: 2]."
  },
  {
    category: "Sexual Reproduction",
    q: "From which cells do gametes (sperm and eggs) develop in sponges?",

    answer: 1,
    note: "Gametes develop from choanocytes or archaeocytes[cite: 2]."

  {
    category: "Sexual Reproduction",
    q: "Because the zygote is retained within the parent body and provided with nourishment until released as a larva, most sponges are considered:",

    answer: 1,
    note: "Most sponges are viviparous; the zygote is retained, nourished, and released as a ciliated larva[cite: 2]."

  {
    category: "Sexual Reproduction",
    q: "During the fertilization process, after sperm enters a sponge through its pores, what happens next?",

    category: "Larval Forms",

    answer: 1,
    note: "Some sponges are oviparous, releasing both sperm and oocytes into water for external fertilization[cite: 2]."
  }
];

let activeFilter = "ALL", filteredQuestions = [], currentIndex = 0, userAnswers = {};

function init() { buildCategoryFilters(); filterQuestionSet(); }

function buildCategoryFilters() {
  const container = document.getElementById("category-filters");
  container.innerHTML = "";
  const categories = ["ALL", ...new Set(questions.map(q => q.category))];
  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = `filter-btn ${cat === activeFilter ? "active" : ""}`;
    btn.textContent = cat === "ALL" ? `All Topics (${questions.length})` : cat;
    btn.onclick = () => { activeFilter = cat; filterQuestionSet(); buildCategoryFilters(); };
    container.appendChild(btn);
  });
}

function filterQuestionSet() {
  filteredQuestions = activeFilter !== "ALL" ? questions.filter(q => q.category === activeFilter) : [...questions];
  currentIndex = 0; userAnswers = {}; initGrid(); renderQuestion();
}

function initGrid() {
  const grid = document.getElementById("grid-jump");
  grid.innerHTML = "";
  filteredQuestions.forEach((_, idx) => {
    const btn = document.createElement("button");
    btn.className = "grid-btn"; btn.textContent = idx + 1;
    btn.onclick = () => jumpToQuestion(idx);
    grid.appendChild(btn);
  });
}

function updateGridStyles() {
  const btns = document.querySelectorAll(".grid-btn");
  btns.forEach((btn, idx) => {
    btn.className = "grid-btn";
    if (idx === currentIndex) btn.classList.add("current");
    if (userAnswers[idx] !== undefined) {
      if (userAnswers[idx] === filteredQuestions[idx].answer) btn.classList.add("answered-correct");
      else btn.classList.add("answered-wrong");
    }
  });
}

function renderQuestion() {
  const item = filteredQuestions[currentIndex];
  document.getElementById("cat-badge").textContent = item.category;
  document.getElementById("question-text").textContent = item.q;
  document.getElementById("question-indicator").textContent = `Question ${currentIndex + 1} of ${filteredQuestions.length}`;
  
  const optionsBox = document.getElementById("options-box");
  optionsBox.innerHTML = "";
  const expBox = document.getElementById("explanation-box");
  expBox.className = "explanation-panel"; expBox.innerHTML = "";

  const hasAnswered = userAnswers[currentIndex] !== undefined;
  item.options.forEach((opt, idx) => {
    const div = document.createElement("div");
    div.className = "option-item";
    if (hasAnswered) div.classList.add("disabled");
    div.innerHTML = `<span class="option-key">${String.fromCharCode(65 + idx)}.</span><span>${opt}</span>`;
    if (hasAnswered) {
      if (idx === item.answer) div.classList.add("correct");
      if (userAnswers[currentIndex] === idx && idx !== item.answer) div.classList.add("wrong");
    } else {
      div.onclick = () => { if (userAnswers[currentIndex] === undefined) { userAnswers[currentIndex] = idx; renderQuestion(); } };
    }
    optionsBox.appendChild(div);
  });

  if (hasAnswered) {
    const isCorr = userAnswers[currentIndex] === item.answer;
    expBox.classList.add("show", isCorr ? "correct" : "wrong");
    expBox.innerHTML = `<strong>${isCorr ? "✓ Correct!" : "✗ Incorrect."}</strong> ${item.note}`;
  }

  document.getElementById("prev-btn").disabled = currentIndex === 0;
  document.getElementById("next-btn").textContent = (currentIndex === filteredQuestions.length - 1) ? "Finish & Review" : "Next →";
  
  const corrCount = Object.keys(userAnswers).filter(k => userAnswers[k] === filteredQuestions[k].answer).length;
  document.getElementById("score-indicator").textContent = `Score: ${corrCount} / ${Object.keys(userAnswers).length}`;
  document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / filteredQuestions.length) * 100}%`;
  updateGridStyles();
}

function jumpToQuestion(idx) { currentIndex = idx; renderQuestion(); }
function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
function nextQuestion() {
  if (currentIndex < filteredQuestions.length - 1) { currentIndex++; renderQuestion(); }
  else {
    document.getElementById("quiz-card").style.display = "none";
    document.getElementById("summary-card").style.display = "block";
    const total = filteredQuestions.length;
    const corr = Object.keys(userAnswers).filter(k => userAnswers[k] === filteredQuestions[k].answer).length;
    const pct = Math.round((corr / total) * 100) || 0;
    document.getElementById("final-score-display").textContent = `${pct}% (${corr}/${total})`;
    document.getElementById("final-remark").textContent = pct >= 80 ? "Great job mastering Chapter 3!" : "Review your notes and try again.";
    
    const reviewBox = document.getElementById("review-container");
    reviewBox.innerHTML = "";
    filteredQuestions.forEach((item, idx) => {
      const uChoice = userAnswers[idx];
      const isCorr = uChoice === item.answer;
      const d = document.createElement("div");
      d.className = `review-item ${isCorr ? "pass" : "fail"}`;
      d.innerHTML = `<strong>Q${idx + 1}: ${item.q}</strong><br/><span style="color:${isCorr?"var(--correct-text)":"var(--wrong-text)"}">Your Answer: ${uChoice !== undefined ? item.options[uChoice] : "Unanswered"}</span><br/>${!isCorr?`Correct: <strong>${item.options[item.answer]}</strong><br/>`:''}<small style="color:var(--text-muted);">${item.note}</small>`;
      reviewBox.appendChild(d);
    });
  }
}

function resetQuiz() {
  userAnswers = {}; currentIndex = 0;
  document.getElementById("summary-card").style.display = "none";
  document.getElementById("quiz-card").style.display = "block";
  renderQuestion();
}

function toggleTheme() {
  const cur = document.body.getAttribute("data-theme");
  document.body.setAttribute("data-theme", cur === "light" ? "dark" : "light");
}

window.onload = init;
</script>
</body>
</html>
