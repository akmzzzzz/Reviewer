<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 5: Worms (Identification)</title>
  <style>
    :root {
      --bg: #0d1117; --card-bg: #161b22; --border: #30363d; --text: #c9d1d9;

    }
    [data-theme="light"] {
      --bg: #f6f8fa; --card-bg: #ffffff; --border: #d0d7de; --text: #24292f;
      --text-heading: #0969da; --text-muted: #57606a; --accent: #0969da;
      --accent-hover: #084298; --accent-glow: rgba(9, 105, 218, 0.08);

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    .grid-btn.answered-wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: var(--wrong-text); }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; margin-bottom: 1.25rem; }
    .category-badge { display: inline-block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 0.75rem; font-weight: 600; }

    /* Identification Specific Styles */

    .override-btn {
      background: transparent; border: 1px solid var(--correct-border); color: var(--correct-text);
      padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; margin-top: 0.75rem; display: inline-block;

    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }

<script>
// Data structure optimized for Identification format
const questions = [
  {
    category: "Phylum Overview",
    q: "What phylum consists of dorsoventrally flattened, acoelomate worms that rely entirely on diffusion for respiration?",
    accepted: ["platyhelminthes", "flatworm"],
    displayAnswer: "Platyhelminthes (Flatworms)",
    note: "Phylum Platyhelminthes (Flatworms) are dorsoventrally flattened and acoelomate, lacking a circulatory or respiratory system."
  },
  {
    category: "Phylum Overview",
    q: "What phylum features cylindrical, unsegmented pseudocoelomates protected by a tough outer cuticle?",
    accepted: ["nematoda", "roundworm"],
    displayAnswer: "Nematoda (Roundworms)",
    note: "Phylum Nematoda (Roundworms) have a cylindrical, unsegmented body plan and are pseudocoelomates with a tough outer cuticle."
  },
  {
    category: "Phylum Overview",
    q: "What phylum is characterized by a true body cavity (coelom) and metameric segmentation?",
    accepted: ["annelid", "annelida", "segmented worm"],
    displayAnswer: "Annelida (Segmented Worms)",
    note: "Phylum Annelida (Segmented Worms) are coelomates with metameric segmentation and specialized organ systems."
  },
  {
    category: "Taxonomy",
    q: "What class of flatworms contains mostly free-living species with a ciliated epidermis, such as Dugesia?",
    accepted: ["turbellaria"],
    displayAnswer: "Turbellaria",
    note: "Class Turbellaria consists mostly of free-living flatworms with a ciliated epidermis."
  },
  {
    category: "Taxonomy",
    q: "What class consists of parasitic flukes with suckers and complex life cycles requiring intermediate hosts?",
    accepted: ["trematoda", "fluke"],
    displayAnswer: "Trematoda",
    note: "Class Trematoda includes parasitic flukes like Fasciola hepatica and Schistosoma japonicum."
  },
  {
    category: "Taxonomy",
    q: "What class consists of parasitic tapeworms that lack a digestive system and absorb nutrients directly through their body surface?",
    accepted: ["cestoda", "tapeworm"],
    displayAnswer: "Cestoda",
    note: "Class Cestoda includes parasitic tapeworms lacking a digestive system."
  },
  {
    category: "Taxonomy",
    q: "What nematode class includes major parasitic species like Ascaris lumbricoides and Enterobius vermicularis?",
    accepted: ["secernentea"],
    displayAnswer: "Secernentea",
    note: "Class Secernentea includes many significant parasitic nematodes."
  },
  {
    category: "Taxonomy",
    q: "What class of segmented worms includes mostly marine species possessing parapodia with numerous setae?",
    accepted: ["polychaeta", "polychaete"],
    displayAnswer: "Polychaeta",
    note: "Class Polychaeta consists mostly of marine worms possessing parapodia with setae."
  },
  {
    category: "Taxonomy",
    q: "What specific subclass of Clitellata includes earthworms, which possess few setae per segment and are crucial for soil aeration?",
    accepted: ["oligochaeta", "oligochaete"],
    displayAnswer: "Oligochaeta",
    note: "Subclass Oligochaeta contains earthworms, which have few setae per segment."
  },
  {
    category: "Taxonomy",
    q: "What class includes ectoparasitic or predatory segmented worms that lack parapodia and chaetae, such as leeches?",
    accepted: ["hirudinea", "leech"],
    displayAnswer: "Hirudinea",
    note: "Class Hirudinea includes leeches, which lack parapodia and chaetae."
  },
  {
    category: "Platyhelminthes Profiles",
    q: "What specific light-sensitive structures are found on the triangular anterior end of planarians (Dugesia sp.)?",
    accepted: ["ocelli", "eyespot"],
    displayAnswer: "Ocelli (eyespots)",
    note: "Dugesia anatomy features two light-sensitive ocelli on a distinct triangular anterior end."
  },
  {
    category: "Platyhelminthes Profiles",
    q: "What protective outer layer prevents the sheep liver fluke (Fasciola hepatica) from being destroyed by host digestive fluids?",
    accepted: ["tegument"],
    displayAnswer: "Tegument",
    note: "The leaf-like body is protected by a thick tegument serving as an adaptation against host digestive fluids."
  },
  {
    category: "Platyhelminthes Profiles",
    q: "What is the specialized groove in the male blood fluke (Schistosoma japonicum) used to cradle the female during copulation?",
    accepted: ["gynecophoric"],
    displayAnswer: "Gynecophoric Canal",
    note: "The Gynecophoric Canal is a groove in the male's body that cradles the female."
  },
  {
    category: "Platyhelminthes Profiles",
    q: "What anatomical structure serves as the head of a pork tapeworm (Taenia solium), armed with suckers and hooklets for mucosal attachment?",
    accepted: ["scolex"],
    displayAnswer: "Scolex",
    note: "The Scolex (head) is armed with suckers and hooklets for mucosal attachment."
  },
  {
    category: "Platyhelminthes Profiles",
    q: "What is the term for the individual tapeworm segments that contain male and female reproductive organs?",
    accepted: ["proglottid"],
    displayAnswer: "Proglottids",
    note: "Proglottids are the chain of segments containing male and female reproductive organs."
  },
  {
    category: "Platyhelminthes Profiles",
    q: "What specific animal serves as the intermediate host for the beef tapeworm (Taenia saginata)?",
    accepted: ["cattle", "cow"],
    displayAnswer: "Cattle",
    note: "Taenia saginata (beef tapeworm) utilizes cattle as its intermediate host."
  },
  {
    category: "Nematoda Profiles",
    q: "What distinct wing-like expansions are located near the head of the pinworm (Enterobius vermicularis)?",
    accepted: ["alae", "cephalic"],
    displayAnswer: "Cephalic alae",
    note: "Enterobius vermicularis features distinct cephalic alae (wing-like expansions near the head)."
  },
  {
    category: "Nematoda Profiles",
    q: "What specialized anterior organ in the whipworm (Trichuris trichiura) embeds into the host's intestinal lining?",
    accepted: ["stichosome"],
    displayAnswer: "Stichosome",
    note: "The Stichosome is a specialized anterior organ that embeds into the host's intestinal lining."
  },
  {
    category: "Nematoda Profiles",
    q: "What distinct physical feature characterizes the barrel-shaped eggs of the whipworm (Trichuris trichiura)?",
    accepted: ["polar plug"],
    displayAnswer: "Polar plugs on both ends",
    note: "The barrel-shaped eggs are characterized by distinct polar plugs on both ends."
  },
  {
    category: "Nematoda Profiles",
    q: "What is the protective, host-derived capsule that encases Trichinella spiralis larvae to maintain dormancy inside host muscle fibers?",
    accepted: ["nurse cell"],
    displayAnswer: "Nurse cell",
    note: "The larva is encased in a protective host-derived capsule called a nurse cell."
  },
  {
    category: "Nematoda Profiles",
    q: "What specific pathology or disease is caused by infection from the Trichinella spiralis worm?",
    accepted: ["trichinosis", "trichinellosis"],
    displayAnswer: "Trichinosis (trichinellosis)",
    note: "Trichinella spiralis causes trichinosis (trichinellosis)."
  },
  {
    category: "Nematoda Profiles",
    q: "What distinct anatomical feature surrounds the anterior mouth of the giant intestinal roundworm (Ascaris lumbricoides)?",
    accepted: ["lip", "three lip"],
    displayAnswer: "Three distinct lips",
    note: "The mouth at the anterior end of Ascaris is surrounded by three distinct lips."
  },
  {
    category: "Nematoda Profiles",
    q: "In Ascaris lumbricoides, how does the posterior end of the male differ from that of the larger female?",
    accepted: ["curved", "hooked"],
    displayAnswer: "The male has a curved posterior end",
    note: "Males are smaller with a curved posterior end; females are larger with a straight posterior end."
  },
  {
    category: "Annelida Profiles",
    q: "What lateral structures on the segments of the clam worm (Nereis sp.) function in both locomotion and respiration?",
    accepted: ["parapodia", "parapodium"],
    displayAnswer: "Parapodia",
    note: "Lateral parapodia on each segment support bristles and function in both locomotion and respiration."
  },
  {
    category: "Annelida Profiles",
    q: "What is the specific term for the well-developed head region of Nereis featuring sensory tentacles, palps, and cirri?",

    displayAnswer: "Prostomium",
    note: "The well-developed head region is called the prostomium."
  },
  {
    category: "Annelida Profiles",
    q: "What structures are found on the eversible pharynx of the clam worm for capturing food?",
    accepted: ["jaw", "chitinous jaw"],
    displayAnswer: "Chitinous jaws",
    note: "The eversible pharynx is equipped with chitinous jaws for capturing food."
  },
  {
    category: "Annelida Profiles",
    q: "What external features on the medicinal leech (Hirudo medicinalis) resemble segments but do not correspond directly to internal segmentation?",
    accepted: ["annulation", "ring"],
    displayAnswer: "Annulations",
    note: "The body surface exhibits external rings called annulations."
  },
  {
    category: "Annelida Profiles",
    q: "What term describes the blood-feeding behavior utilized by the anterior and posterior suckers of the medicinal leech?",
    accepted: ["hematophagous", "hematophagy", "blood-feeding", "blood feeding"],
    displayAnswer: "Hematophagous feeding",
    note: "Suckers are utilized for movement and hematophagous (blood) feeding."
  },
  {
    category: "Annelida Profiles",
    q: "What internal partitions exactly match the external cylindrical segments of the earthworm (Lumbricus terrestris)?",
    accepted: ["septa", "septum"],
    displayAnswer: "Septa",
    note: "External segments match internal partitions called septa."
  },
  {
    category: "Annelida Profiles",
    q: "What prominent, swollen glandular band near the anterior end of an earthworm secretes a reproductive cocoon?",
    accepted: ["clitellum"],
    displayAnswer: "Clitellum",
    note: "The Clitellum is a prominent, swollen glandular band that secretes a reproductive cocoon."
  },
  {
    category: "Annelida Profiles",
    q: "Through what anatomical structures does respiration entirely occur in the earthworm?",
    accepted: ["cuticle", "body wall", "skin", "diffusion"],
    displayAnswer: "A thin, moist, cuticle-covered body wall (via diffusion)",
    note: "Respiration occurs entirely via diffusion through a thin, moist, cuticle-covered body wall."
  }
];

let activeFilter = "ALL", filteredQuestions = [], currentIndex = 0, userAnswers = {};

function init() { 
  buildCategoryFilters(); 
  filterQuestionSet(); 
  
  // Allow hitting 'Enter' to submit
  document.getElementById("ident-input").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      if(document.getElementById("check-btn").style.display !== "none") {
        checkAnswer();
      } else {
        nextQuestion();
      }
    }
  });
}

function buildCategoryFilters() {
  const container = document.getElementById("category-filters");
  container.innerHTML = "";
  const categories = ["ALL", ...new Set(questions.map(q => q.category))];
  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = `filter-btn ${cat === activeFilter ? "active" : ""}`;
    btn.textContent = cat === "ALL" ? `All Topics (${questions.length})` : cat;
    btn.onclick = () => { activeFilter = cat; filterQuestionSet(); buildCategoryFilters(); };
    container.appendChild(btn);
  });
}

function filterQuestionSet() {
  filteredQuestions = activeFilter !== "ALL" ? questions.filter(q => q.category === activeFilter) : [...questions];
  currentIndex = 0; userAnswers = {}; initGrid(); renderQuestion();
}

function initGrid() {
  const grid = document.getElementById("grid-jump");
  grid.innerHTML = "";
  filteredQuestions.forEach((_, idx) => {
    const btn = document.createElement("button");
    btn.className = "grid-btn"; btn.textContent = idx + 1;
    btn.onclick = () => jumpToQuestion(idx);
    grid.appendChild(btn);
  });
}

function updateGridStyles() {
  const btns = document.querySelectorAll(".grid-btn");
  btns.forEach((btn, idx) => {
    btn.className = "grid-btn";
    if (idx === currentIndex) btn.classList.add("current");
    if (userAnswers[idx] !== undefined) {
      if (userAnswers[idx].isCorrect) btn.classList.add("answered-correct");
      else btn.classList.add("answered-wrong");
    }
  });
}

function renderQuestion() {
  const item = filteredQuestions[currentIndex];
  document.getElementById("cat-badge").textContent = item.category;
  document.getElementById("question-text").textContent = item.q;
  document.getElementById("question-indicator").textContent = `Question ${currentIndex + 1} of ${filteredQuestions.length}`;
  
  const inputEl = document.getElementById("ident-input");
  const checkBtn = document.getElementById("check-btn");
  const nextBtn = document.getElementById("next-btn");
  const expBox = document.getElementById("explanation-box");
  
  expBox.className = "explanation-panel"; 
  expBox.innerHTML = "";
  
  if (userAnswers[currentIndex] !== undefined) {
    // Already answered
    inputEl.value = userAnswers[currentIndex].text;
    inputEl.disabled = true;
    checkBtn.style.display = "none";
    nextBtn.style.display = "block";
    nextBtn.textContent = (currentIndex === filteredQuestions.length - 1) ? "Finish & Review" : "Next →";
    showExplanation(userAnswers[currentIndex].isCorrect, item.displayAnswer, item.note);
  } else {
    // Not answered yet
    inputEl.value = "";
    inputEl.disabled = false;
    checkBtn.style.display = "block";
    nextBtn.style.display = "none";
    inputEl.focus();
  }

  document.getElementById("prev-btn").disabled = currentIndex === 0;
  
  // Calculate score
  const answeredKeys = Object.keys(userAnswers);
  const corrCount = answeredKeys.filter(k => userAnswers[k].isCorrect).length;
  document.getElementById("score-indicator").textContent = `Score: ${corrCount} / ${answeredKeys.length}`;
  document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / filteredQuestions.length) * 100}%`;
  
  updateGridStyles();
}

function checkAnswer() {
  const inputEl = document.getElementById("ident-input");
  const userText = inputEl.value.trim().toLowerCase();
  
  if(userText === "") return; // Don't submit empty
  
  const item = filteredQuestions[currentIndex];
  
  // Smart match logic: Does the user string contain any of the accepted root words?
  let isCorrect = item.accepted.some(ans => userText.includes(ans.toLowerCase()));
  
  userAnswers[currentIndex] = {
    text: inputEl.value,
    isCorrect: isCorrect
  };
  
  renderQuestion();
}

function showExplanation(isCorrect, displayAnswer, note) {
  const expBox = document.getElementById("explanation-box");
  expBox.classList.add("show", isCorrect ? "correct" : "wrong");
  
  let html = `<strong>${isCorrect ? "✓ Correct!" : "✗ Incorrect."}</strong><br/>`;
  html += `<strong>Correct Answer:</strong> ${displayAnswer}<br/><br/>`;
  html += `<small>${note}</small>`;
  
  // Add manual override button if the system marked it wrong
  if (!isCorrect) {
    html += `<br/><button class="override-btn" onclick="overrideGrade()">I got this right (Override)</button>`;
  }
  
  expBox.innerHTML = html;
}

function overrideGrade() {
  if(userAnswers[currentIndex]) {
    userAnswers[currentIndex].isCorrect = true;
    renderQuestion();
  }
}

function jumpToQuestion(idx) { currentIndex = idx; renderQuestion(); }
function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
function nextQuestion() {
  if (currentIndex < filteredQuestions.length - 1) { 
    currentIndex++; 
    renderQuestion(); 
  } else {
    document.getElementById("quiz-card").style.display = "none";
    document.getElementById("summary-card").style.display = "block";
    
    const total = filteredQuestions.length;
    const answeredKeys = Object.keys(userAnswers);
    const corr = answeredKeys.filter(k => userAnswers[k].isCorrect).length;
    const pct = Math.round((corr / total) * 100) || 0;
    
    document.getElementById("final-score-display").textContent = `${pct}% (${corr}/${total})`;
    document.getElementById("final-remark").textContent = pct >= 80 ? "Superb mastery of Chapter 5!" : "Review your notes and try again.";
    
    const reviewBox = document.getElementById("review-container");
    reviewBox.innerHTML = "";
    filteredQuestions.forEach((item, idx) => {
      const uAns = userAnswers[idx];
      const isCorr = uAns ? uAns.isCorrect : false;
      const d = document.createElement("div");
      d.className = `review-item ${isCorr ? "pass" : "fail"}`;
      d.innerHTML = `
        <strong>Q${idx + 1}: ${item.q}</strong><br/>
        <span style="color:${isCorr ? "var(--correct-text)" : "var(--wrong-text)"}">
          Your Answer: ${uAns ? uAns.text : "Unanswered"}
        </span><br/>
        ${!isCorr ? `Correct Answer: <strong>${item.displayAnswer}</strong><br/>` : ''}
        <small style="color:var(--text-muted);">${item.note}</small>
      `;
      reviewBox.appendChild(d);
    });
  }
}

function resetQuiz() {
  userAnswers = {}; currentIndex = 0;
  document.getElementById("summary-card").style.display = "none";
  document.getElementById("quiz-card").style.display = "block";
  renderQuestion();
}

function toggleTheme() {
  const cur = document.body.getAttribute("data-theme");
  document.body.setAttribute("data-theme", cur === "light" ? "dark" : "light");
}

window.onload = init;
</script>
</body>
